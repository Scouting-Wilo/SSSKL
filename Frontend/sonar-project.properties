# Project metadata
sonar.projectKey=Scouting-Wilo_SSSKL_Frontend
sonar.organization=scouting-wilo

# Paths to sources and tests
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=src/**/*.spec.ts
sonar.exclusions=node_modules/**, dist/**, .angular/**, src/**/*.spec.ts, src/test-setup.ts

# Coverage reporting
sonar.javascript.lcov.reportPaths=coverage/lcov.info
# Dev-server proxy config, not part of the app bundle
sonar.coverage.exclusions=src/proxy.conf.js

# Encoding
sonar.sourceEncoding=UTF-8
