# Builds and tests the backend on every push to master, version tag and pull request that changes it (see
# changes.yml; a version tag always builds). On master and on version tags it then pushes the API's Docker image
# (linux/amd64 and linux/arm64) to ghcr.io/scouting-wilo/ssskl-api; a pull request only checks that the image
# builds. See docs/docker.md. Without backend changes every job is skipped, which still satisfies the required
# "Build & Test" check.
#
# Dependabot PRs (rebased on every master push) get a lean run: Build & Test only for NuGet, Docker and
# GitHub Actions updates (not npm), and the Docker image check only for Docker base-image updates.
#
# Image tags pushed:
#   master, sha-<short hash>      every push to master
#   1.4.0, 1.4, latest            a tag v1.4.0 (on master); a server that follows `latest` only gets releases
name: Backend CI

on:
  push:
    branches: [ "master" ]
    tags: [ "v*" ]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DOTNET_VERSION: '11.0.x'                 # set this to the .NET Core version to use
  # The registry wants a lower-case name
  IMAGE: ghcr.io/scouting-wilo/ssskl-api

jobs:
  changes:
    name: Changes
    uses: ./.github/workflows/changes.yml

  build:
    name: Build & Test
    needs: changes
    if: >-
      needs.changes.outputs.backend == 'true' && (
      github.event.pull_request.user.login != 'dependabot[bot]' ||
      startsWith(github.head_ref, 'dependabot/nuget/') ||
      startsWith(github.head_ref, 'dependabot/docker/') ||
      startsWith(github.head_ref, 'dependabot/github_actions/'))
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Decode and save SixLabors license
      run: |
        if [ -z "${{ secrets.SixLaborsLicense }}" ]; then
          echo "SixLaborsLicense secret is missing or empty"
          exit 1
        fi
        echo "${{ secrets.SixLaborsLicense }}" | base64 -d > ./sixlabors.lic
        cp ./sixlabors.lic ../sixlabors.lic

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore

    - name: Test
      run: dotnet test --no-build --verbosity normal

  scan:
    name: SonarCloud Analyze
    needs: build
    # Dependabot PRs get no OIDC token for SonarCloud; the build job still verifies them. Tags are the master commit,
    # already analyzed. Runs only after a build, so only when the backend changed.
    if: github.event.pull_request.user.login != 'dependabot[bot]' && !startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # secretless SonarCloud analysis: the auth step trades the job's OIDC token for a SonarCloud token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup JDK 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: 21
          distribution: 'zulu'

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Decode and save SixLabors license
        run: |
          if [ -z "${{ secrets.SixLaborsLicense }}" ]; then
            echo "SixLaborsLicense secret is missing or empty"
            exit 1
          fi
          echo "${{ secrets.SixLaborsLicense }}" | base64 -d > ./sixlabors.lic
          cp ./sixlabors.lic ../sixlabors.lic

      - name: Cache SonarCloud packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Install SonarCloud scanner
        run: |
          dotnet tool install --global dotnet-sonarscanner

      - name: Authenticate to SonarCloud
        # Exports a 30-minute token, scoped to this project, as SONAR_TOKEN for the next steps.
        uses: SonarSource/sonarqube-auth-action@b372e2c2930aadfcc4f4399446da1e12772709ad # v1.2
        with:
          project-key: scouting-wilo_SSSKL_Backend

      - name: Build and analyze
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dotnet-sonarscanner begin \
            /k:"scouting-wilo_SSSKL_Backend" \
            /o:"scouting-wilo" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.cs.opencover.reportsPaths="**/*.opencover.xml" \
            /d:sonar.exclusions="Frontend/**,Mobile/**,**/Migrations/**,**/Components/**,**/Controllers/**,**/Pages/**,**/DependencyInjection.cs,**/Program.cs" \
            /d:sonar.scanner.skipJreProvisioning=true

          dotnet build SSSKL.slnx

          dotnet test SSSKL.slnx --no-build --verbosity normal \
            /p:CollectCoverage=true \
            /p:CoverletOutputFormat=opencover

          dotnet-sonarscanner end /d:sonar.token="$SONAR_TOKEN"

  version:
    name: Version
    needs: changes
    # Skipping it for Dependabot also skips the image job, except for Docker base-image updates.
    if: >-
      needs.changes.outputs.backend == 'true' &&
      (github.event.pull_request.user.login != 'dependabot[bot]' || startsWith(github.head_ref, 'dependabot/docker/'))
    uses: ./.github/workflows/version.yml

  image:
    name: Docker image
    needs: [build, version]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Decode and save SixLabors license
        env:
          SIXLABORS_LICENSE: ${{ secrets.SixLaborsLicense }}
        run: |
          if [ -z "$SIXLABORS_LICENSE" ]; then
            echo "SixLaborsLicense secret is missing or empty"
            exit 1
          fi
          echo "$SIXLABORS_LICENSE" | base64 -d > "$RUNNER_TEMP/sixlabors.lic"

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch,enable={{is_default_branch}}
            type=sha,enable=${{ github.ref == 'refs/heads/master' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ needs.version.outputs.stable == 'true' }}
            type=raw,value=latest,enable=${{ needs.version.outputs.stable == 'true' }}
          labels: |
            org.opencontainers.image.title=SSSKL API

      # Only the few RUN steps of the final stage need emulation; the .NET build cross-compiles
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: .
          file: Backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          # A pull request only checks that the image builds
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ needs.version.outputs.version }}
          secret-files: sixlabors_lic=${{ runner.temp }}/sixlabors.lic
          cache-from: type=gha,scope=ssskl-api
          cache-to: type=gha,mode=max,scope=ssskl-api
          provenance: true
          sbom: true

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: github.event_name != 'pull_request'
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
