# GitHub CodeQL code scanning for the API and the MAUI app (C#), the SPA (TypeScript) and the workflows themselves.
# Results show under Security → Code scanning and as annotations on pull requests.
#
# C# uses build-mode none: CodeQL reads the sources without compiling them, so the analysis needs neither the
# SixLabors license nor the MAUI workloads, and covers Backend/ and Mobile/ in one pass.
# This is the advanced setup: keep CodeQL's "default setup" off in the repository settings, or the uploads clash.
name: CodeQL

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  schedule:
    # Weekly, so new queries also run over code that hasn't changed.
    - cron: '27 3 * * 1'
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: csharp
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Lets CodeQL resolve the NuGet packages of the net11.0 projects, so types from them are known.
      - name: Setup .NET
        if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '11.0.x'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-and-quality
          config: |
            paths-ignore:
              - '**/Migrations/**'
              - 'Frontend/node_modules/**'
              - 'Frontend/dist/**'

      - name: Analyze
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
